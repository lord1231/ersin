<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b5bd6'/%3E%3Ccircle cx='50' cy='50' r='28' fill='%23fff'/%3E%3C/svg%3E">
<title>Şarkı Analizi</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f7; --fg:#1d1d1f; --card:#fff; --accent:#5b5bd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e2e; --fg:#f0f0f5; --card:#2a2a3c; --accent:#8b8bff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg);
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: .9rem; margin: 8px 0 4px; }
  input[type=text] {
    width: 100%; padding: 10px; font-size: 1rem; border-radius: 8px;
    border: 1px solid #888; background: transparent; color: var(--fg);
  }
  input[type=file] { width: 100%; font-size: .95rem; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 12px 16px; font-size: 1rem; margin: 6px 6px 0 0;
  }
  button:disabled { opacity: .5; }
  pre {
    white-space: pre-wrap; word-wrap: break-word; font-family: inherit;
    font-size: .95rem; line-height: 1.45; margin: 0;
  }
  #status { font-size: .95rem; min-height: 1.2em; }
</style>
</head>
<body>

<h1>Şarkı Analizi ve Suno Prompt</h1>

<div class="card">
  <input type="file" id="file" accept="audio/*">
  <label for="title">Başlık (isteğe bağlı, boş bırakılırsa dosya adı kullanılır)</label>
  <input type="text" id="title" placeholder="Şarkı başlığı">
  <label for="year">Yıl (isteğe bağlı)</label>
  <input type="text" id="year" placeholder="Örn. 1985">
  <label for="country">Ülke (isteğe bağlı)</label>
  <input type="text" id="country" placeholder="Örn. Türkiye">
  <label for="region">Yöre (isteğe bağlı)</label>
  <input type="text" id="region" placeholder="Örn. Karadeniz">
  <button id="go">Analiz et</button>
</div>

<div class="card">
  <div id="status">Bir ses dosyası seçin.</div>
</div>

<div class="card" id="resultCard" hidden>
  <pre id="result"></pre>
  <button id="copy">Kopyala</button>
  <button id="share">Paylaş</button>
</div>

<script>
const $ = id => document.getElementById(id);
let resultText = "";

// ---------- Ses çözme (tarayıcının desteklediği formatlar) ----------
async function decodeMono(file) {
  const buf = await file.arrayBuffer();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(buf);
  const ch = audio.numberOfChannels;
  const len = audio.length;
  const mono = new Float32Array(len);
  for (let c = 0; c < ch; c++) {
    const d = audio.getChannelData(c);
    for (let i = 0; i < len; i++) mono[i] += d[i] / ch;
  }
  const sr = audio.sampleRate;
  ac.close();
  return { mono, sr };
}

// ---------- Tempo: enerji zarfı + otokorelasyon (60–200 BPM) ----------
function estimateBpm(x, sr) {
  const hop = 512, win = 1024;
  const frames = Math.floor((x.length - win) / hop);
  const env = new Float32Array(frames);
  let prev = 0;
  for (let f = 0; f < frames; f++) {
    let e = 0;
    const s = f * hop;
    for (let i = 0; i < win; i++) e += x[s + i] * x[s + i];
    e = Math.sqrt(e / win);
    env[f] = Math.max(0, e - prev);
    prev = e;
  }
  const fps = sr / hop;
  const minLag = Math.floor(fps * 60 / 200);
  const maxLag = Math.floor(fps * 60 / 60);
  let bestLag = minLag, bestScore = -1;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let acc = 0;
    for (let i = lag; i < frames; i++) acc += env[i] * env[i - lag];
    if (acc > bestScore) { bestScore = acc; bestLag = lag; }
  }
  return Math.round(60 * fps / bestLag);
}

// ---------- Tonalite: Goertzel ile kromatik profil + Krumhansl korelasyonu ----------
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const MAJOR = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const MINOR = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

function goertzel(x, start, n, freq, sr) {
  const coeff = 2 * Math.cos(2 * Math.PI * freq / sr);
  let s1 = 0, s2 = 0;
  for (let i = 0; i < n; i++) {
    const s = x[start + i] + coeff * s1 - s2;
    s2 = s1; s1 = s;
  }
  return s1 * s1 + s2 * s2 - coeff * s1 * s2;
}

function pearson(a, b) {
  const ma = a.reduce((p, c) => p + c, 0) / a.length;
  const mb = b.reduce((p, c) => p + c, 0) / b.length;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) {
    const x = a[i] - ma, y = b[i] - mb;
    num += x * y; da += x * x; db += y * y;
  }
  return (da === 0 || db === 0) ? 0 : num / Math.sqrt(da * db);
}

function estimateKey(x, sr, maxSamples) {
  const win = 4096, hop = 8192;
  const end = Math.min(x.length, maxSamples);
  const chroma = new Array(12).fill(0);
  for (let start = 0; start + win <= end; start += hop) {
    for (let midi = 36; midi <= 83; midi++) {
      const f = 440 * Math.pow(2, (midi - 69) / 12);
      chroma[midi % 12] += goertzel(x, start, win, f, sr);
    }
  }
  let best = -2, bestTonic = 0, bestScale = "majör";
  for (let t = 0; t < 12; t++) {
    const rot = chroma.map((_, i) => chroma[(i + t) % 12]);
    const cMaj = pearson(rot, MAJOR);
    const cMin = pearson(rot, MINOR);
    if (cMaj > best) { best = cMaj; bestTonic = t; bestScale = "majör"; }
    if (cMin > best) { best = cMin; bestTonic = t; bestScale = "minör"; }
  }
  return { tonic: NAMES[bestTonic], scale: bestScale };
}

// ---------- Enerji ve ton rengi ----------
function features(x) {
  let sq = 0, zc = 0;
  for (let i = 0; i < x.length; i++) {
    sq += x[i] * x[i];
    if (i > 0 && (x[i] >= 0) !== (x[i - 1] >= 0)) zc++;
  }
  return { rms: Math.sqrt(sq / x.length), zcr: zc / x.length };
}

// ---------- Tür ipucu, Suno prompt'u ve sunum metni ----------
function genreHint(bpm, minor) {
  if (bpm < 85)  return minor ? "slow melancholic ballad" : "slow acoustic pop";
  if (bpm < 115) return minor ? "mid-tempo folk-rock" : "upbeat pop";
  if (bpm < 140) return "dance-pop / rock";
  return "fast rock / electronic";
}

function sunoPrompt(r, country, region) {
  const minor = r.scale === "minör";
  const mood = minor ? "melancholic" : "upbeat";
  const instruments = r.brightness === "parlak"
    ? "electric guitar, drums, synth"
    : "acoustic guitar, soft piano, strings";
  const place = [country, region].map(s => s.trim()).filter(Boolean).join(" ");
  const era = r.year && r.year.length >= 3 ? r.year.slice(0, 3) + "0s" : null;
  let p = `${genreHint(r.bpm, minor)}, ${r.bpm} BPM, ${r.tonic} ${r.scale}, ${mood}, ${instruments}`;
  if (place) p += `, ${place} style`;
  if (era) p += `, ${era} era`;
  return p;
}

function presentation(r, country, region) {
  const place = [country, region].map(s => s.trim()).filter(Boolean).join(" / ");
  const mm = Math.floor(r.durationSec / 60);
  const ss = String(r.durationSec % 60).padStart(2, "0");
  return [
    "ŞARKI ANALİZİ",
    `Başlık: ${r.title || "Bilinmiyor"}`,
    `Yıl: ${r.year || "Girilmedi"}`,
    `Süre: ${mm}:${ss}`,
    `Tempo (tahmini): ${r.bpm} BPM`,
    `Ton (tahmini): ${r.tonic} ${r.scale}`,
    `Enerji: ${r.energy}`,
    `Ton rengi: ${r.brightness}`,
    `Tür (tahmini): ${genreHint(r.bpm, r.scale === "minör")}`,
    `Ülke/Yöre: ${place || "Girilmedi"}`,
    "",
    "SUNO PROMPT",
    sunoPrompt(r, country, region),
    "",
    "VARSAYIMLAR VE SINIRLAR",
    "Tempo, ton, enerji ve enstrüman tahminleri kural tabanlıdır ve yanlış olabilir.",
    "Ülke, yöre ve yıl yalnızca elle girildiyse yazılır; sesten tahmin edilmez.",
    "Akor dizisi bu sürümde yoktur."
  ].join("\n");
}

// ---------- Arayüz ----------
$("go").addEventListener("click", async () => {
  const file = $("file").files[0];
  if (!file) { $("status").textContent = "Önce bir ses dosyası seçin."; return; }
  $("go").disabled = true;
  $("resultCard").hidden = true;
  $("status").textContent = "Analiz ediliyor, lütfen bekleyin...";
  try {
    await new Promise(r => setTimeout(r, 50));
    const { mono, sr } = await decodeMono(file);
    const bpm = estimateBpm(mono, sr);
    const { tonic, scale } = estimateKey(mono, sr, sr * 90);
    const { rms, zcr } = features(mono);

    const report = {
      title: $("title").value.trim() || file.name.replace(/\.[^.]+$/, ""),
      year: $("year").value.trim(),
      durationSec: Math.round(mono.length / sr),
      bpm, tonic, scale,
      energy: rms > 0.15 ? "yüksek" : "düşük/orta",
      brightness: zcr > 0.12 ? "parlak" : "koyu"
    };
    resultText = presentation(report, $("country").value, $("region").value);
    $("result").textContent = resultText;
    $("resultCard").hidden = false;
    $("status").textContent = "Analiz tamamlandı.";
  } catch (e) {
    $("status").textContent = "Hata: bu dosya tarayıcıda çözülemedi. (" + (e.message || e.name) + ")";
  } finally {
    $("go").disabled = false;
  }
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(resultText);
    $("status").textContent = "Kopyalandı.";
  } catch {
    $("status").textContent = "Kopyalama başarısız. Metni elle seçip kopyalayın.";
  }
});

$("share").addEventListener("click", async () => {
  if (navigator.share) {
    try { await navigator.share({ title: "Şarkı analizi", text: resultText }); } catch {}
  } else {
    $("status").textContent = "Bu tarayıcı paylaşımı desteklemiyor. Kopyala düğmesini kullanın.";
  }
});
</script>
</body>
</html>
